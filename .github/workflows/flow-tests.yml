name: flow

# Quality gates for the /flow plugin. `plugins/flow` is the only package in this
# repo with its own package.json, so this workflow has exactly one job.
#
# To cover another plugin later: copy the `flow` job, point `working-directory`
# and `cache-dependency-path` at the new plugin directory, and rename the job.
# Jobs stay independent so one plugin's red gate never hides another's.
#
# This workflow deliberately has NO `paths:` filter: the "flow plugin" check is
# REQUIRED on `main`, and a required check must report on every PR —
# a path-filtered workflow leaves non-matching PRs waiting forever on a check
# that never runs. The job costs ~25s; that is the price of a check that can
# actually block. If you re-add a filter, first un-require the check.
#
# `merge_group` is here for the same reason. `main` merges through a merge queue,
# which runs every required check again on the combined tree (main plus every
# pull request ahead in the queue) before it merges. A required check that does
# not listen for `merge_group` never reports there, and the queue waits on it
# until it times out, for every pull request behind it. The job has no `if:`
# for the same reason. `pull_request` stays too: a required check has to pass
# on the pull request before the queue will take it.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a branch makes the previous run's answer obsolete. Every merge
# group runs on a ref of its own (`gh-readonly-queue/main/pr-<n>-<base sha>`), so
# queue runs never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  flow:
    name: flow plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/flow

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/flow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Config schema is in sync with its Zod source
        run: |
          npm run generate:schema
          if ! git diff --exit-code -- config/config.schema.json; then
            echo "::error file=plugins/flow/config/config.schema.json::config.schema.json no longer matches the Zod schema it is generated from. Never hand-edit it: run 'npm run generate:schema' in plugins/flow and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Format check
        run: npm run format:check
