name: security-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  statuses: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # PLACEHOLDER: Dorian must create/install the App, then pin its numeric bot user ID here.
  SECURITY_APPROVAL_BOT_USER_ID: '0'
  # Security's list for the marketplace (security-auditor research,
  # marketplace-security-gate-scope.md, 2026-10-30): everything a package ships
  # into users' DorkOS (catalog, manifests, hooks, extensions, commands, skills,
  # scripts, config), plus CI, agent config and dependencies. Docs, tests and
  # fixtures inside a plugin are exempt. The workflow and its implementation are
  # covered by .github/. Match both sides of renames.
  SECURITY_PATH_PATTERN: '^\.claude-plugin/|^\.github/|^\.claude/|^\.agents/|^\.dork/|^scripts/|^tools/|^plugins/[^/]+/(?!(?:[^/]+/)*(?:docs|tests|engine-tests|fixtures)/)(?![^/]+\.md$)(?!LICENSE$)(?!NOTICE$)|^plugins/.*SKILL\.md$|(^|/)\.\.?(/|$)|//|(^|/)[pP][aA][cC][kK][aA][gG][eE]\.[jJ][sS][oO][nN]$|(^|/)package-lock\.json$|(^|/)npm-shrinkwrap\.json$|(^|/)pnpm-lock\.yaml$|(^|/)pnpm-workspace\.yaml$|(^|/)yarn\.lock$|(^|/)bun\.lockb?$|(^|/)\.npmrc$|(^|/)\.yarnrc(\.yml)?$|(^|/)\.nvmrc$|(^|/)\.node-version$|(^|/)patches/|(^|/)\.pnpmfile\.cjs$|(^|/)codeowners$'

jobs:
  security-gate:
    # Enforcement requires the ruleset workflow source pinned to main. A named
    # status check alone lets a candidate replace this YAML. See ci/security-gate-promotion.md.
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    env:
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an immutable base SHA
        run: '[[ "$SECURITY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SECURITY_BASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Security gate fixtures
        run: node --test .github/scripts/security-*.test.mjs
      - name: Check approval on each exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/security-gate.mjs
