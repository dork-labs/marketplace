name: security-gate

on:
  pull_request:
    # labeled/unlabeled: in label-at-head mode, adding the label or `hold` changes the verdict.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:

concurrency:
  # A push to a pull request makes its older runs here worthless, so they cancel.
  # Only `pull_request` and `pull_request_target` runs share a group (one per
  # workflow and pull request). Every other event, `merge_group` included, is
  # keyed on its own run id, so nothing can cancel it or replace it while it is
  # pending. The newest run in a group is never the cancelled one, so the
  # newest head always reports.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  statuses: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # '0' means no App is set, so the gate runs label-at-head. A real numeric bot user ID
  # means App mode. Anything else refuses.
  SECURITY_APPROVAL_BOT_USER_ID: '0'
  # Security's list for the marketplace: everything under plugins/, with no exemptions
  # (SECURITY-GATE.md says why), plus the catalog, CI, agent config and dependencies.
  # Agent config (.claude, .codex, .opencode, opencode.json, CLAUDE.md, AGENTS.md,
  # GEMINI.md) counts at any depth. The workflow and its implementation are covered
  # by .github/. Match both sides of renames.
  SECURITY_PATH_PATTERN: '^\.claude-plugin/|^REVIEW\.md$|(^|/)(CLAUDE|AGENTS|GEMINI)\.md$|(^|/)opencode\.json$|^\.mcp\.json$|^\.github/|(^|/)\.(claude|codex|opencode)(/|$)|^\.agents/|^\.dork/|^scripts/|^tools/|^plugins(/|$)|(^|/)\.\.?(/|$)|//|(^|/)[pP][aA][cC][kK][aA][gG][eE]\.[jJ][sS][oO][nN]$|(^|/)package-lock\.json$|(^|/)npm-shrinkwrap\.json$|(^|/)pnpm-lock\.yaml$|(^|/)pnpm-workspace\.yaml$|(^|/)yarn\.lock$|(^|/)bun\.lockb?$|(^|/)\.npmrc$|(^|/)\.yarnrc(\.yml)?$|(^|/)\.nvmrc$|(^|/)\.node-version$|(^|/)patches/|(^|/)\.pnpmfile\.cjs$|(^|/)codeowners$'

  # The P0 list, where a diff also needs security-deep-reviewed newer than its last
  # push: every workflow and the gate's own scripts (Security, 2026-11-03). Every path
  # added here must also match SECURITY_PATH_PATTERN. Main's verdict asks for the deep
  # label on workflow files and the gate's own files as well (security-verdict.mjs).
  SECURITY_DEEP_PATH_PATTERN: '^\.github/workflows/|^\.github/scripts/security-|^scripts/security-'

jobs:
  security-gate:
    # Enforcement requires the ruleset workflow source pinned to main. A named
    # status check alone lets a candidate replace this YAML. See .github/SECURITY-GATE.md.
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    env:
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an immutable base SHA
        run: '[[ "$SECURITY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SECURITY_BASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Security gate fixtures
        run: node --test .github/scripts/security-*.test.mjs
      - name: Check approval on each exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/security-gate.mjs
