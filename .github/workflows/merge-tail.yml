name: merge-tail

# Arms auto-merge on pull requests that are finished, so a green, reviewed pull
# request lands without a person pressing the button. Agents arm their own
# (`gh pr merge --auto --squash <n>`, CLAUDE.md); this is the backstop for the
# ones nobody armed.
#
# The decision is scripts/should-arm-automerge.sh, fixture-pinned by
# scripts/test-should-arm-automerge.sh (run by scripts-test.yml), because the
# failure mode here is silent: a refusal that stops matching keeps answering ARM
# and the first symptom is unreviewed code on `main`. A pull request is armed
# only when every signal is explicitly good; `hold`, `do-not-merge`, `wip` and
# `blocked` keep one from being armed, as they do in dork-labs/dorkos.
#
# Ported from dork-labs/dorkos (.github/workflows/merge-tail.yml). The dorkos
# version also re-requests a lost automated review; that half is left out because
# this repo runs no automated review workflow.
#
# What it deliberately does NOT do: update branches. Once `main` merges through a
# merge queue, the queue tests each pull request on top of `main` itself, so being
# behind blocks nothing and a branch update only re-runs jobs.
#
# WHOSE KEY IT HOLDS: the `dorkos-merge-tail` GitHub App, the same app dorkos
# uses (client id in the `MERGE_TAIL_APP_CLIENT_ID` secret, private key in
# `MERGE_TAIL_APP_PRIVATE_KEY`). It can write contents and pull requests and read
# checks, and has no Administration permission, so this workflow cannot edit the
# branch rules or bypass them. Never GITHUB_TOKEN, for two reasons:
#   - A merge made by GITHUB_TOKEN triggers no workflows, so the push-to-main run
#     of the `schemas` check would silently never happen.
#   - Under a merge queue, a merge group created by GITHUB_TOKEN gets no check
#     runs at all and blocks the queue for every pull request behind it until it
#     times out (measured in dorkos on PR #581).
# With no app secrets the first step fails, naming them, and nothing is armed.

on:
  schedule:
    # GitHub throttles scheduled workflows well below this: dorkos measured a
    # median gap of 162 minutes over 200 runs. This is a backstop, not the path.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the verdict for every open PR without arming anything"
        type: boolean
        default: false

# Never let two ticks arm the same PR concurrently.
concurrency:
  group: merge-tail
  cancel-in-progress: false

# Only enough for GITHUB_TOKEN to check the repo out. Every GitHub call in the
# job uses the app token instead (see the header for why).
permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checked first so a repo without the app says exactly what is missing,
      # instead of failing inside the token action with a less direct message.
      - name: The merge-tail app secrets are set
        env:
          HAVE_CLIENT_ID: ${{ secrets.MERGE_TAIL_APP_CLIENT_ID != '' }}
          HAVE_PRIVATE_KEY: ${{ secrets.MERGE_TAIL_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAVE_CLIENT_ID" != "true" || "$HAVE_PRIVATE_KEY" != "true" ]]; then
            echo "::error::merge-tail cannot run: set the MERGE_TAIL_APP_CLIENT_ID and MERGE_TAIL_APP_PRIVATE_KEY secrets on this repository, and install the dorkos-merge-tail GitHub App on it. Nothing was armed."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Mint the merge-tail app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_TAIL_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_TAIL_APP_PRIVATE_KEY }}
          # No `permission-*` inputs: they scope the token DOWN to exactly the
          # named set, so naming one would drop the rest. The token inherits the
          # installation's permissions (contents and pull requests write, checks
          # read), which is what arming needs.

      - name: Arm auto-merge on finished PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          # Every payload is composed from FILES with `jq -s`, never from shell
          # interpolation: a multi-line gh error captured into a variable and
          # passed to --argjson is a parse failure that reads as an unreadable
          # payload, indistinguishable from a real refusal.
          work=$(mktemp -d)
          armed=0; skipped=0; failed=0; perm_denied=0

          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number --jq '.[].number' > "$work/prs.txt" || {
              echo "::error::could not list pull requests"; exit 1; }

          echo "Open PRs: $(wc -l < "$work/prs.txt" | tr -d ' ')"
          echo

          while read -r pr; do
            [[ -n "$pr" ]] || continue

            if ! gh pr view "$pr" --repo "$REPO" \
                 --json number,state,isDraft,mergeStateStatus,autoMergeRequest,reviewDecision,labels \
                 > "$work/meta.json" 2>"$work/err.txt"; then
              echo "PR #$pr -> SKIP could-not-read-pr ($(tr '\n' ' ' < "$work/err.txt" | cut -c1-120))"
              skipped=$(( skipped + 1 )); continue
            fi

            # GitHub runs this block with `bash -e`, so every read below that
            # can fail ends in `|| :` (or `|| var=`): one PR's unreadable answer
            # must become that PR's SKIP, never the end of the tick for every
            # PR after it. What each failure turns into is decided right after.
            #
            # An unparseable checks body becomes "no checks", which the gate
            # refuses.
            gh pr checks "$pr" --repo "$REPO" --json name,bucket > "$work/checks.json" 2>/dev/null || :
            jq -e . "$work/checks.json" >/dev/null 2>&1 || echo '[]' > "$work/checks.json"

            # `mergeQueueEntry` is GraphQL-only, and it is not optional: a pull
            # request in the merge queue reports `autoMergeRequest: null`, so
            # without it every queued pull request would be re-armed every tick.
            # The `$owner` in single quotes is GraphQL's variable, not the shell's.
            # shellcheck disable=SC2016
            gh api graphql -F number="$pr" -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    mergeQueueEntry{ position state }
                    reviewThreads(last:100){ nodes{ isResolved } } } } }' \
              > "$work/gql.json" 2>/dev/null || :
            # Both reads produce NOTHING unless the response really holds the
            # pull request. A GraphQL error still prints a body, with
            # `"data": null`, and read loosely that body says "not queued, no
            # open threads", which is two green signals out of a failure.
            threads=$(jq 'if (.data.repository.pullRequest.reviewThreads.nodes | type) == "array"
                          then [.data.repository.pullRequest.reviewThreads.nodes[]
                                | select(.isResolved == false)] | length
                          else empty end' \
                      "$work/gql.json" 2>/dev/null) || threads=
            queued=$(jq -c 'if (.data.repository.pullRequest | type) == "object"
                            then .data.repository.pullRequest.mergeQueueEntry // null
                            else empty end' \
                     "$work/gql.json" 2>/dev/null) || queued=
            # So an unreadable queue entry never reads as "not queued", and an
            # unreadable thread count never reads as zero.
            [[ -n "$queued" ]] || { echo "PR #$pr -> SKIP could-not-read-queue-entry"; skipped=$(( skipped + 1 )); continue; }
            if ! [[ "$threads" =~ ^[0-9]+$ ]]; then
              echo "PR #$pr -> SKIP could-not-read-review-threads"
              skipped=$(( skipped + 1 )); continue
            fi

            jq -s --argjson t "$threads" --argjson q "$queued" \
              '.[0] + {checks: .[1], unresolvedThreads: $t, mergeQueueEntry: $q}' \
              "$work/meta.json" "$work/checks.json" > "$work/payload.json"

            # The gate exits 2 on an unreadable payload by design; under
            # `bash -e` that must stay this PR's SKIP.
            verdict=$(./scripts/should-arm-automerge.sh "$work/payload.json") \
              || verdict="SKIP unreadable-payload"

            if [[ "$verdict" != "ARM" ]]; then
              echo "PR #$pr -> $verdict"
              skipped=$(( skipped + 1 )); continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "PR #$pr -> ARM (dry run, not armed)"
              armed=$(( armed + 1 )); continue
            fi

            # `--squash` is this repo's merge method. Under a merge queue the
            # queue owns the method and gh notes on stderr that it ignored the
            # flag; that note is only read when the call fails.
            if out=$(gh pr merge --auto --squash "$pr" --repo "$REPO" 2>&1); then
              echo "PR #$pr -> ARMED"
              armed=$(( armed + 1 ))
            else
              one_line=$(tr '\n' ' ' <<<"$out" | cut -c1-200)
              # Losing a race (the PR merged or closed between the read and the
              # write) is expected and fixes itself. A permissions refusal means
              # this workflow cannot do its job at all, and every run would be a
              # correct verdict followed by nothing, so that one shouts.
              if [[ "$one_line" == *"not accessible"* \
                 || "$one_line" == *"HTTP 403"* ]]; then
                echo "::error::merge-tail cannot arm pull requests: $one_line"
                echo "::error::This is a token-permission failure, not a race. The workflow does nothing until it is fixed."
                perm_denied=$(( perm_denied + 1 ))
              else
                echo "PR #$pr -> ARM FAILED: $one_line"
              fi
              failed=$(( failed + 1 ))
            fi
          done < "$work/prs.txt"

          echo
          echo "armed=$armed skipped=$skipped failed=$failed perm_denied=$perm_denied"

          # Written BEFORE the failure exit below, so the permission-denied line
          # (which only prints when the step is about to fail) can render.
          # `if`, never `[[ ... ]] && echo`: under `bash -e` a false test at the
          # end of the group fails the whole step.
          {
            echo "### merge-tail"
            echo
            echo "- armed: $armed"
            echo "- skipped: $skipped"
            echo "- arm failed: $failed"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- (dry run: nothing was actually armed)"
            fi
            if [[ "$perm_denied" -gt 0 ]]; then
              echo "- **permission denied on $perm_denied arm(s) — this workflow is doing nothing**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A run that decides everything correctly and then may arm nothing
          # looks identical to a quiet day. Fail instead of reporting green.
          if [[ "$perm_denied" -gt 0 ]]; then
            echo "::error::merge-tail armed nothing: $perm_denied arm attempt(s) refused for lack of permission."
            exit 1
          fi
